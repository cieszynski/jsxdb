<body>
    <main>
        <p>hier passierts</p>
        <input type="search">

    <script type="module">
        import JSxDB from '../jsxdb.js';

        const runTest = async () => {

            const db = await JSxDB.init("test.db", {
                1: {
                    user: "@id, firstname, lastname",
                },
            });
            try {
                const [store1] = await db.write("user");
                const count = await store1.count();

                if (!count) {
                    for await (
                        const item of [
                            { firstname: "a", lastname: "A" },
                            { firstname: "b", lastname: "B" },
                            { firstname: "c", lastname: "C" },
                        ]
                    ) {
                        store1.add(item);
                    }
                }
                const result = await store1
                    .where('firstname', 'a')
                    .and('lastname', '<=', 'C')
                    //.or('lastname', '<=', 'C')
                    .limit(2)
                    .reverse()
                    .query();

                console.table(result);

                const dump = await store1.getAllRecords();

                console.log(dump)

                const dump2 = await store1.getAll();

                console.log(dump2)

                // store1.clear();
                db.close();

            } catch (ex) { console.error(ex) }
        }

        runTest();
    </script>
</body>
